name: Sync mini branches

# The mini site (MiniPay) is the same code as the web site — it differs only in
# environment (Celo chain config in NEXT_PUBLIC_CHAINS, see docs/MINIPAY.md),
# set per branch in the same Netlify project. So each mini branch is a plain
# mirror of its web counterpart, existing only to give Netlify a branch to build
# with that env.
#
#   development -> mini-development
#   main        -> mini
#
# Because it is a mirror, anything committed onto a mini branch directly is
# discarded on the next push upstream. Mini-only changes belong in that branch's
# env vars, not in a branch.

on:
  push:
    branches:
      - development
      - main
  # Run it by hand from the Actions tab to seed a mini branch without waiting
  # for the next push; dispatch it from development or main, since the target
  # is chosen from the branch it runs on.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror onto the matching mini branch
        env:
          # Via env rather than inline interpolation, so a branch name is never
          # pasted into the shell.
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          case "$SOURCE_BRANCH" in
            development) target=mini-development ;;
            main) target=mini ;;
            *)
              echo "No mini branch is mapped to $SOURCE_BRANCH"
              exit 1
              ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pushing the commit straight at the target ref creates the branch if
          # it does not exist yet and force-updates it if it does, so no local
          # checkout of the target is needed (and none exists on a first run).
          git push --force origin "HEAD:refs/heads/$target"

          echo "✓ $target now matches $SOURCE_BRANCH ($(git rev-parse --short HEAD))"
