name: Keep Supabase alive

# To keep another project alive, add an entry to the matrix below with its own
# secret pair.

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one project failing should not skip the others
      matrix:
        include:
          - name: demo
            url: ${{ secrets.SUPABASE_URL_DEMO }}
            key: ${{ secrets.SUPABASE_ANON_KEY_DEMO }}
          - name: development
            url: ${{ secrets.SUPABASE_URL_DEVELOPMENT }}
            key: ${{ secrets.SUPABASE_ANON_KEY_DEVELOPMENT }}
    steps:
      - name: Query the ${{ matrix.name }} database
        env:
          SUPABASE_URL: ${{ matrix.url }}
          SUPABASE_ANON_KEY: ${{ matrix.key }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing secrets for the ${{ matrix.name }} project"
            exit 1
          fi
          # Query a real table so PostgREST runs SQL against Postgres (this is
          # what counts as activity — hitting /rest/v1/ alone does not).
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/stacks_metadata?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "✓ ${{ matrix.name }} reached, project kept alive"
          else
            echo "✗ ${{ matrix.name }} returned unexpected status $status"
            exit 1
          fi
