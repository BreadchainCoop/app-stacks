packages:
  - "."

blockExoticSubdeps: true
minimumReleaseAge: 864000 # 10 days
strictDepBuilds: true
trustPolicy: no-downgrade

# pnpm v11: explicit per-package build script approval
allowBuilds:
  "@reown/appkit": true
  bufferutil: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

overrides:
  "@noble/curves@1.8.0": "^1.9.7"
  "semver@6.3.1": "^7.7.4"
