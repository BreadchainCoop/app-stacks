packages:
  - "."

blockExoticSubdeps: true
minimumReleaseAge: 864000 # 10 days
minimumReleaseAgeExclude:
  - "@breadcoop/ui"
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "jose"

# pnpm v11: explicit per-package build script approval
allowBuilds:
  "@reown/appkit": true
  bufferutil: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

overrides:
  "@noble/curves": ">=1.9.0"
  "semver": ">=6.3.2"
  "@breadcoop/ui": "2.0.1"
